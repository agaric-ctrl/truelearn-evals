# Controlled experiment: identical to 03 EXCEPT the sources are enriched to
# contain the true-but-previously-unsourced detail the models kept adding.
# One variable changed (the source). Prediction: prior failures flip to PASS,
# proving they were unsourced-elaboration, not hallucination.
# PLACEHOLDER: the source/question pairs below are hand-written synthetic clinical-QA
# content - not TrueLearn content, not clinician-reviewed.
# Run: npx promptfoo@latest eval -c 04_generator_enriched.yaml && npx promptfoo@latest view
description: "Enriched source - same models, same judge, sources now contain the detail"

prompts:
  - |
    You are writing an explanation for a medical board exam question.
    Use ONLY the source material below. Do not add facts beyond it.

    SOURCE MATERIAL: "{{source}}"
    QUESTION: {{question}}

    Write a concise 2-3 sentence explanation.

providers:
  - id: anthropic:messages:claude-sonnet-5
    config:
      max_tokens: 1024
  - id: anthropic:messages:claude-haiku-4-5
    config:
      max_tokens: 1024
  - id: anthropic:messages:claude-opus-4-8
    config:
      max_tokens: 1024

defaultTest:
  assert:
    - type: llm-rubric
      provider: anthropic:claude-sonnet-5
      value: |
        SOURCE MATERIAL: "{{source}}"
        Evaluate whether EVERY medical claim in the output is supported by the
        SOURCE MATERIAL above. PASS only if all claims are grounded in the source.
        FAIL if the output introduces any medical claim not present in the source,
        or contradicts it.

tests:
  - description: "inferior MI (enriched with RCA territory)"
    vars:
      question: "A 55-year-old has chest pain and ST elevation in II, III, aVF. Diagnosis and cause?"
      source: "ST elevation in leads II, III, and aVF indicates an inferior wall MI, most commonly caused by occlusion of the right coronary artery (RCA). The RCA typically supplies the inferior wall of the left ventricle, which is why occlusion produces changes in these inferior leads."

  - description: "hyperkalemia (enriched with mechanism)"
    vars:
      question: "What ECG changes are seen with high potassium?"
      source: "Hyperkalemia produces characteristic ECG changes including peaked T waves and a widened QRS complex. These findings are the hallmark electrocardiographic manifestations of elevated serum potassium levels and reflect its effect on cardiac cell membranes."

  - description: "anaphylaxis (enriched with timing/route)"
    vars:
      question: "What is the first-line treatment for anaphylaxis?"
      source: "The first-line treatment for anaphylaxis is intramuscular epinephrine, which should be administered promptly as the immediate, initial intervention of choice for a patient presenting with an anaphylactic reaction."

  - description: "DKA (enriched with mechanisms)"
    vars:
      question: "How is diabetic ketoacidosis managed?"
      source: "Diabetic ketoacidosis is managed with intravenous fluids, insulin, and electrolyte correction. Intravenous fluids address the dehydration commonly associated with DKA, insulin works to lower elevated blood glucose and halt ketone production, and electrolyte correction replaces losses such as potassium. Together these interventions restore the patient's metabolic balance."
