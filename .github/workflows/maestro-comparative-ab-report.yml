name: Maestro Comparative A/B variant report

# Manual/on-demand only, per docs/qa-context/COMPARATIVE_AB_TESTING_TASK.md's CI-wiring section:
# comparative runs are exploratory/investigative, not a pass/fail gate, so this deliberately does
# NOT belong in validate.yml's PR-blocking job - same reasoning as
# faithfulness-framework-evaluation.yml being its own file rather than a conditional step there.
#
# Makes real, paid Anthropic API calls (workflow_dispatch + ANTHROPIC_API_KEY secret required, same
# safeguards tools/validate_workflows.py enforces on faithfulness-framework-evaluation.yml - this
# file is in that same LIVE_WORKFLOW_NAMES set for that reason).
#
# Runs against maestro/comparative/fixtures/hand_constructed_pair.json by default - a
# hand-constructed variant pair, NOT real Maestro output. Per the task doc: "do not run this
# against real Maestro output for prompt-merging-vs-RAG specifically until those variants actually
# exist to compare" - pass a different --pair input to compare a real variant pair once one exists.
#
# Only runs the three Tier 3 judges installable from requirements-maestro.txt in one job
# (deepeval-based faithfulness, non-contradiction, source-coverage) - RAGAS (separate venv, click
# conflict) and Promptfoo (needs Node, never auto-run anywhere in this repo even for the existing
# three-judge setup) are not included here. See maestro/comparative/run_variant_pair.py's own
# module docstring for how to add their contributions via a separate run + merge.

on:
  workflow_dispatch:
    inputs:
      pair:
        description: "Path to a variant-pair JSON file"
        required: true
        default: "maestro/comparative/fixtures/hand_constructed_pair.json"
        type: string

permissions:
  contents: read

jobs:
  comparative-ab-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require API key
        run: test -n "$ANTHROPIC_API_KEY"
      - name: Install Maestro dependencies
        run: python -m pip install -r requirements-maestro.txt
      - name: Run Tier 1 + available Tier 3 judges against both variants
        run: |
          mkdir -p /tmp/maestro-comparative
          python maestro/comparative/run_variant_pair.py \
            --pair "${{ inputs.pair }}" \
            --out-a /tmp/maestro-comparative/variant_a.json \
            --out-b /tmp/maestro-comparative/variant_b.json
      - name: Render side-by-side diff report
        run: |
          python maestro/comparative/render_variant_diff_report.py \
            --pair "${{ inputs.pair }}" \
            --variant-a-eval /tmp/maestro-comparative/variant_a.json \
            --variant-b-eval /tmp/maestro-comparative/variant_b.json \
            --out /tmp/maestro-comparative/variant-diff-report.html
      - name: Upload comparative diff report artifact
        uses: actions/upload-artifact@v4
        with:
          name: maestro-comparative-ab-report
          path: /tmp/maestro-comparative/variant-diff-report.html
          if-no-files-found: error
