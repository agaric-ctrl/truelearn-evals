name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile tools/*.py evaluations/faithfulness/deepeval/*.py evaluations/faithfulness/ragas/*.py
      - name: Test normalized result contract
        run: python -m unittest tools/test_result_schema.py
      - name: Validate gold dataset
        run: >-
          python -c "import json; data=json.load(open('evaluations/faithfulness/data/gold_cases.json'));
          assert len(data) >= 1 and all(c.get('expected_pass') is not None and
          c.get('review_status') == 'pending_clinician_review' and c.get('claims')
          for c in data)"
      - name: Validate gold prediction join
        run: |
          python -c 'import json; from tools.gold_accuracy import join_predictions; gold=json.load(open("evaluations/faithfulness/data/demo_gold_cases.json")); result=[{"cases": [{"case_id": "grounded", "passed": True}, {"case_id": "hallucinated", "passed": False}]}]; assert join_predictions(gold, result)'
      - name: Validate retrieval dataset and metrics
        run: python tools/retrieval_correctness.py evaluations/faithfulness/data/metric_cases.json
      - name: Validate comparison tool
        run: python tools/compare_results.py evaluations/faithfulness/data/demo_results.json
      - name: Validate metadata utilities
        run: >-
          python -c "from tools.run_metadata import summarize_metadata;
          assert summarize_metadata([{'model': 'test', 'latency_ms': 1,
          'estimated_cost_usd': 0.01}])['total_latency_ms'] == 1"
      - name: Validate HTML report generator
        run: python tools/html_report.py evaluations/faithfulness/data/demo_results.json /tmp/faithfulness-report.html
      - name: Validate provider usage utilities
        run: >-
          python -c "from tools.provider_usage import extract_usage, estimate_cost;
          u=extract_usage({'usage': {'input_tokens': 100, 'output_tokens': 20}});
          assert estimate_cost(u, 1, 1) == 0.00012"
      - name: Validate workflow safeguards
        run: python tools/validate_workflows.py .github/workflows
      - name: Validate Promptfoo adapter
        run: python tools/promptfoo_results.py evaluations/faithfulness/data/promptfoo_result_fixture.json /tmp/promptfoo-result.json
      - name: Check regression baseline
        run: python tools/regression.py evaluations/faithfulness/data/regression_baseline.json evaluations/faithfulness/data/regression_current.json
      - name: Validate reliability analysis
        run: python tools/reliability.py evaluations/faithfulness/data/reliability_fixture.json
      - name: Compare multi-judge fixture
        run: python tools/reliability.py evaluations/faithfulness/data/multi_judge_fixture.json
      - name: Check gold regression accuracy
        run: python tools/gold_accuracy.py evaluations/faithfulness/data/gold_predictions.json --min-accuracy 0.90
      - name: Validate schema migration
        run: >-
          python -c "from tools.schema_migrations import migrate_result;
          assert migrate_result({'framework': 'legacy', 'metric': 'faithfulness',
          'cases': []})['schema_version'] == 1"
      - name: Scan checked-in evaluation data
        run: |
          for file in evaluations/faithfulness/data/*.json; do
            python tools/privacy_scan.py "$file"
          done
      - name: Install Maestro dependencies
        run: python -m pip install -r requirements-maestro.txt
      - name: Check Maestro Python syntax
        run: python -m py_compile maestro/*.py maestro/checks/*.py maestro/golden/*.py maestro/judge/*.py maestro/generation/*.py maestro/ingestion/*.py
      - name: Test Maestro question checks
        run: python -m unittest maestro/test_maestro.py
      - name: Smoke test Maestro CLI on example data
        run: python maestro/runner.py maestro/examples/sample_question.json --config maestro/examples/sample_config.json
      - name: Test Maestro golden-set and review-pool tooling
        run: python -m unittest maestro/test_golden.py
      - name: Smoke test Maestro generate -> grade -> import loop
        run: |
          mkdir -p /tmp/maestro-review-pools
          python maestro/golden/generate_pool.py \
            --batch maestro/examples/sample_golden_batch.jsonl --seed 42 \
            --out-xlsx /tmp/maestro-review-pools/ci_smoke.xlsx \
            --out-mapping /tmp/maestro-review-pools/ci_smoke.mapping.json
          python -c "
          import openpyxl
          wb = openpyxl.load_workbook('/tmp/maestro-review-pools/ci_smoke.xlsx')
          ws = wb.active
          headers = [c.value for c in ws[1]]
          grade_col, reviewer_col = headers.index('grade') + 1, headers.index('reviewer_id') + 1
          for row in range(2, ws.max_row + 1):
              ws.cell(row=row, column=grade_col).value = 'approve'
              ws.cell(row=row, column=reviewer_col).value = 'ci-smoke'
          wb.save('/tmp/maestro-review-pools/ci_smoke.xlsx')
          "
          python maestro/golden/import_pool.py \
            --graded-xlsx /tmp/maestro-review-pools/ci_smoke.xlsx \
            --mapping /tmp/maestro-review-pools/ci_smoke.mapping.json \
            --golden-dir /tmp/maestro-review-pools/golden_out \
            --outcomes-json /tmp/maestro-review-pools/ci_smoke.outcomes.json
          # Hooked in right after the existing import-loop smoke test above, per
          # docs/qa-context/REPORTING_SUMMARY_TASK.md - no new CI infrastructure, just the next
          # step reading what the import step already produces. Written to /tmp, not committed:
          # this is throwaway CI-smoke data, not a real run of maestro/golden_data/import_summary.md.
          python maestro/golden/import_summary.py \
            --outcomes-json /tmp/maestro-review-pools/ci_smoke.outcomes.json \
            --out /tmp/maestro-review-pools/ci_smoke.import_summary.md
      - name: Test Maestro golden-set import summary
        run: python -m unittest maestro/test_import_summary.py
      - name: Test Maestro Editorial-asset staging (docx conversion, tiering, image pairs)
        run: python -m unittest maestro/test_editorial_staging.py
      - name: Validate committed golden datasets parse
        run: >-
          python -c "import glob, json;
          from maestro.golden.models import load_golden_example;
          paths = glob.glob('maestro/golden_data/*.jsonl');
          [load_golden_example(json.loads(line)) for p in paths for line in open(p, encoding='utf-8') if line.strip()];
          print(f'Validated {len(paths)} golden data file(s).')
          "
      - name: Test Maestro judge (offline only - no ANTHROPIC_API_KEY here, no live model calls)
        run: python -m unittest maestro/test_judge.py
      - name: Test Maestro generation payload and revision-loop checks
        run: python -m unittest maestro/test_generation.py
      - name: Test Maestro candidate-ingestion seam
        run: python -m unittest maestro/test_ingestion.py
      - name: Compare Tier 3 judges (offline fixture, no live calls)
        run: python -m unittest maestro/test_judge_compare.py
      - name: Validate Promptfoo third-judge suite matches its fixture (no Node/live call needed)
        run: python -m unittest maestro/test_judge_promptfoo_suite.py
      - name: Smoke test Maestro ingest_batch --mock -> generate_pool loop
        run: |
          mkdir -p /tmp/maestro-review-pools
          python maestro/ingestion/ingest_batch.py \
            --mock --out /tmp/maestro-review-pools/mock_ingested_batch.jsonl
          python maestro/golden/generate_pool.py \
            --batch /tmp/maestro-review-pools/mock_ingested_batch.jsonl --seed 42 \
            --out-xlsx /tmp/maestro-review-pools/ingestion_smoke.xlsx \
            --out-mapping /tmp/maestro-review-pools/ingestion_smoke.mapping.json
      - name: Check patch formatting
        run: git diff --check

  maestro-ragas-judge:
    # Separate job/venv, not folded into offline-validation: ragas and deepeval conflict on the
    # click dependency (see requirements-maestro-ragas.txt), so this can't install alongside
    # requirements-maestro.txt in the same environment. Offline only, same as test_judge.py above -
    # no ANTHROPIC_API_KEY here, no live model calls, every test injects a fake scorer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Maestro RAGAS-judge dependencies
        run: python -m pip install -r requirements-maestro-ragas.txt
      - name: Test Maestro judge, RAGAS variant (offline only - no ANTHROPIC_API_KEY here, no live model calls)
        run: python -m unittest maestro/test_judge_ragas.py
